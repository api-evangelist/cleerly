aid: cleerly
name: Cleerly
description: >-
  Cleerly is a digital healthcare company building an AI-powered platform for
  the diagnosis and management of coronary artery disease (heart disease). Its
  software analyzes coronary CT angiography (CCTA) imaging to automatically
  quantify and characterize atherosclerotic plaque, measure stenosis severity,
  and stage disease, giving physicians a precise, personalized picture of a
  patient's heart-disease risk. The goal is to move heart-disease care from
  symptom-based testing toward direct measurement of plaque, reducing
  unnecessary invasive procedures while improving diagnostic accuracy. Cleerly
  operates as an enterprise clinical SaaS delivered to health systems,
  cardiologists, and imaging centers rather than a public developer API
  program; it publishes a marketing and clinical-evidence site plus a
  clinician-facing application (Cleerly Labs) and a public trust center. Cleerly
  is backed by Battery Ventures and Insight Partners.
